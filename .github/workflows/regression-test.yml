name: Regression Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Godot 4.7 (.NET)
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_win64.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
          Get-ChildItem godot -Recurse -Filter *.exe | Select-Object FullName
          # The mono zip nests its files under a top-level folder, so resolve
          # the console exe dynamically instead of hardcoding a path.
          $exe = (Get-ChildItem godot -Recurse -Filter "*_console.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "Godot console exe not found after extraction"; exit 1 }
          "GODOT_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "GODOT_EXE=$exe"

      - name: Build C# assembly
        run: dotnet build ringo.csproj -c Debug

      - name: Import project assets
        run: |
          & $env:GODOT_EXE --headless --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression test
        env:
          RINGO_RUN_TESTS: "1"
        run: |
          & $env:GODOT_EXE --headless -e --path .
          Write-Host "editor exit code: $LASTEXITCODE"
          Get-Content .\test_result.txt
          if (-not (Select-String -Path .\test_result.txt -Pattern "RINGO_TEST_RESULT: PASS" -Quiet)) { exit 1 }
